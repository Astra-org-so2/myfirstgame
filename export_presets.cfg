; Export presets — AFTER YOU (Phase 18, RELEASE_BUILD.md).
;
; Two Android presets (TECH_DESIGN §15.3, ADR-021):
;   "Android QA"   — debug export: ADB install, logcat, the F1/F6
;                    debug tools are ON (OS.is_debug_build), the
;                    perf protocol of TEST_PLAN §7 runs on it.
;   "Android"      — the release build: the primary target. The
;                    debug tools are OFF (gated handlers + gated
;                    node creation, P14/P18).
;
; Signing: the keystores are NOT in git (§15.3) — the editor's
; Android signing settings (or a gradle signing block) point to
; local files / CI env vars. The release keystore path below is a
; LOCAL placeholder; set yours in Editor Settings > Export >
; Android (or override per-machine, never commit the key).
;
; minSdk 26 (Android 8.0) — §15.2. ASTC texture compression —
; §15.1. Landscape lock + safe area — project.godot
; (window/handheld/orientation=0, stretch aspect expand).

